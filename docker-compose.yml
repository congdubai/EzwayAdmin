version: "3.9"
services:
  EzwayAdmin:
    container_name: WebEkycAdmin
    image: webekycadmin/shinhanekyc:admin
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8085
      # request body beauty
    networks:
      - webekycadmin
    volumes:
      - ./logs:/app/logs
networks:
  webekycadmin:
    driver: bridge

